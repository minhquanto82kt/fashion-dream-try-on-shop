name: One-time AI sidebar cleanup

on:
  push:
    branches:
      - feature/product-admin

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'chore(ai): remove redundant Style Analyzer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/product-admin
          fetch-depth: 0

      - name: Remove redundant Style Analyzer item
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('fashion-dream-try-on-main/src/routes/ai.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''        <button type="button" disabled className={`${itemClass(false)} cursor-not-allowed opacity-45`}>
          <span>Style Analyzer</span>
          <span className="text-[9px]">SOON</span>
        </button>
'''

          if old not in text:
              raise SystemExit('Expected Style Analyzer block was not found; aborting without changes.')

          path.write_text(text.replace(old, ''), encoding='utf-8')
          PY

      - name: Commit AI sidebar cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fashion-dream-try-on-main/src/routes/ai.tsx
          git commit -m "chore(ai): remove redundant Style Analyzer"
          git push origin feature/product-admin

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/one-time-ai-sidebar-cleanup.yml
          git commit -m "chore(ci): remove one-time AI sidebar cleanup workflow"
          git push origin feature/product-admin
