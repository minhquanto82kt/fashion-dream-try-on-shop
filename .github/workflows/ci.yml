name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: write

defaults:
  run:
    working-directory: fashion-dream-try-on-main

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fashion-dream-try-on-main/package-lock.json

      - name: Pin npm for lockfile repair
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          if npm ci 2>&1 | tee /tmp/npm-ci.log; then
            exit 0
          fi

          if ! grep -Eq 'Missing: @emnapi/(core|runtime|wasi-threads)@' /tmp/npm-ci.log; then
            echo 'npm ci failed for a reason unrelated to the known optional-dependency lock drift.'
            exit 1
          fi

          echo 'Detected known @emnapi optional-dependency lock drift; regenerating package-lock.json on the Linux CI runner.'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo 'No package-lock.json change was produced; refusing to hide the npm ci failure.'
            exit 1
          fi
          git commit -m 'chore(deps): sync package lock for CI [lock-sync]'
          git push origin HEAD:${GITHUB_REF_NAME}

          npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Smoke tests
        run: npm run test:smoke
