name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

defaults:
  run:
    working-directory: fashion-dream-try-on-main

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fashion-dream-try-on-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Start local app for route smoke tests
        shell: bash
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/wearo-dev.log 2>&1 &
          echo $! > /tmp/wearo-dev.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wearo-dev.log
          exit 1

      - name: Smoke tests
        run: npm run test:smoke

      - name: Customer experience smoke tests
        run: npm run test:customer-experience
