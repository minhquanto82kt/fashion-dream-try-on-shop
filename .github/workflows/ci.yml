name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: write

defaults:
  run:
    working-directory: fashion-dream-try-on-main

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fashion-dream-try-on-main/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          if npm ci 2>&1 | tee /tmp/npm-ci.log; then
            exit 0
          fi
          if ! grep -Eq 'Missing: @emnapi/(core|runtime|wasi-threads)@' /tmp/npm-ci.log; then
            echo 'npm ci failed for an unrelated reason.'
            exit 1
          fi
          echo 'Repairing platform-specific optional dependency lock entries from a clean Linux x64 resolver.'
          npm install --package-lock-only --include=optional --os=linux --cpu=x64 --ignore-scripts --no-audit --no-fund
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(deps): regenerate linux lock entries [lock-sync]'
          git push origin HEAD:${GITHUB_REF_NAME}
          npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Start local app for route smoke tests
        shell: bash
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/wearo-dev.log 2>&1 &
          echo $! > /tmp/wearo-dev.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wearo-dev.log
          exit 1

      - name: Smoke tests
        run: npm run test:smoke

      - name: Customer experience smoke tests
        run: npm run test:customer-experience
