name: Self Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"
  push:
    paths:
      - ".github/maintenance.yml"
      - ".github/workflows/self-maintenance.yml"
      - ".github/agents/self-maintenance-engineer.md"
      - "fashion-dream-try-on-main/package-lock.json"

permissions:
  contents: read

concurrency:
  group: self-maintenance-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-smoke-test-placeholder

jobs:
  detect:
    name: Detect maintenance findings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fashion-dream-try-on-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fashion-dream-try-on-main/package-lock.json

      - name: Install dependencies from committed lockfile
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Read maintenance mode
        id: config
        shell: bash
        run: |
          MODE=$(awk -F': ' '/^mode:/ {print $2; exit}' ../.github/maintenance.yml)
          AUTO_FIX=$(awk -F': ' '/^auto_fix:/ {print $2; exit}' ../.github/maintenance.yml)
          echo "mode=${MODE:-unknown}" >> "$GITHUB_OUTPUT"
          echo "auto_fix=${AUTO_FIX:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke test
        env:
          BASE_URL: http://127.0.0.1:8080
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/wearo-maintenance.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 "$BASE_URL/" >/dev/null; then
              npm run test:smoke
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wearo-maintenance.log
          exit 1

      - name: Maintenance summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Self-Maintenance"
            echo ""
            echo "Mode: ${{ steps.config.outputs.mode }}"
            echo "Auto-fix: ${{ steps.config.outputs.auto_fix }}"
            echo ""
            echo "Detect-only: no source files, dependencies, database, secrets, or production configuration are modified."
            echo ""
            echo "Verification commands: npm run lint, npm run build, npm run test:smoke"
          } >> "$GITHUB_STEP_SUMMARY"
