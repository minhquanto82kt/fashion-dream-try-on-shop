name: Frontend foundation + smoke tests

on:
  push:
    branches:
      - main
      - feature/product-admin
      - foundation/phase-1-city-modernization
  pull_request:

jobs:
  foundation-and-smoke:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://oazipcrbutizdncctkcg.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-smoke-test-placeholder
    defaults:
      run:
        working-directory: fashion-dream-try-on-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fashion-dream-try-on-main/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Foundation architecture gate
        run: npm run test:foundation

      - name: Start development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/wearo-vite.log 2>&1 &
          echo $! > /tmp/wearo-vite.pid

      - name: Wait for development server
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wearo-vite.log
          exit 1

      - name: Run route smoke tests
        run: npm run test:smoke
        env:
          BASE_URL: http://127.0.0.1:8080

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/wearo-vite.log
