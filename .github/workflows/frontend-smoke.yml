name: Frontend smoke tests

on:
  push:
    branches:
      - main
      - feature/product-admin
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://oazipcrbutizdncctkcg.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-smoke-test-placeholder
    defaults:
      run:
        working-directory: fashion-dream-try-on-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify npm runtime
        run: |
          node --version
          npm --version

      - name: Bootstrap missing lockfile
        if: github.event_name == 'push' && !hashFiles('fashion-dream-try-on-main/package-lock.json')
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund

      - name: Persist generated lockfile
        if: github.event_name == 'push' && hashFiles('fashion-dream-try-on-main/package-lock.json')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fashion-dream-try-on-main/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): persist npm lockfile"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: Secret exposure gate
        run: npm run security:secrets

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/wearo-vite.log 2>&1 &
          echo $! > /tmp/wearo-vite.pid

      - name: Wait for development server
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/wearo-vite.log
          exit 1

      - name: Run customer experience validation
        run: npm run test:customer-experience
        env:
          BASE_URL: http://127.0.0.1:8080

      - name: Run lint
        run: npm run lint

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/wearo-vite.log
