name: Frontend smoke tests

on:
  push:
    branches:
      - main
      - feature/product-admin
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://oazipcrbutizdncctkcg.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-smoke-test-placeholder
    defaults:
      run:
        working-directory: fashion-dream-try-on-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify npm runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies from lockfile
        if: hashFiles('fashion-dream-try-on-main/package-lock.json')
        run: npm ci --no-audit --no-fund

      - name: Bootstrap dependencies and lockfile
        if: ${{ !hashFiles('fashion-dream-try-on-main/package-lock.json') }}
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Upload generated lockfile for bootstrap recovery
        if: ${{ hashFiles('fashion-dream-try-on-main/package-lock.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: fashion-dream-try-on-main/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Publish generated lockfile to recovery branch
        if: ${{ github.event_name == 'push' && github.ref_name == 'feature/product-admin' && hashFiles('fashion-dream-try-on-main/package-lock.json') != '' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b ci/lockfile-recovery
          git add fashion-dream-try-on-main/package-lock.json
          git commit -m "chore(ci): add generated npm lockfile"
          git push origin HEAD:ci/lockfile-recovery

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: Secret exposure gate
        run: npm run security:secrets

      - name: Build
        run: npm run build

      - name: Typecheck generated route tree
        run: npm run typecheck

      - name: Start development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/wearo-vite.log 2>&1 &
          echo $! > /tmp/wearo-vite.pid

      - name: Wait for development server
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/wearo-vite.log
          exit 1

      - name: Run customer experience validation
        run: npm run test:customer-experience
        env:
          BASE_URL: http://127.0.0.1:8080

      - name: Run lint
        run: npm run lint

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/wearo-vite.log
