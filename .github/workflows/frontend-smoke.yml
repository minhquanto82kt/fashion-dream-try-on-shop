name: Frontend smoke tests

on:
  push:
    branches:
      - main
      - feature/product-admin
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      # These values are only used so browser-safe Supabase helpers can be imported
      # during the CI smoke server. The publishable key is intentionally a CI-only
      # placeholder because the smoke suite does not exercise Supabase mutations.
      VITE_SUPABASE_URL: https://oazipcrbutizdncctkcg.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-smoke-test-placeholder
    defaults:
      run:
        working-directory: fashion-dream-try-on-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Start development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/wearo-vite.log 2>&1 &
          echo $! > /tmp/wearo-vite.pid

      - name: Wait for development server
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wearo-vite.log
          exit 1

      - name: Run customer experience validation
        run: npm run test:customer-experience
        env:
          BASE_URL: http://127.0.0.1:8080

      - name: Run lint
        run: npm run lint

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/wearo-vite.log
