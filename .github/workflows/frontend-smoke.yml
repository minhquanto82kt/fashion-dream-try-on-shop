name: Frontend smoke tests

on:
  push:
    branches:
      - main
      - feature/product-admin
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://oazipcrbutizdncctkcg.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-smoke-test-placeholder
    defaults:
      run:
        working-directory: fashion-dream-try-on-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify npm runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies from lockfile
        if: hashFiles('fashion-dream-try-on-main/package-lock.json')
        run: npm ci --no-audit --no-fund

      - name: Bootstrap dependencies and lockfile
        if: ${{ hashFiles('fashion-dream-try-on-main/package-lock.json') == '' }}
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Upload generated lockfile for bootstrap recovery
        if: ${{ hashFiles('fashion-dream-try-on-main/package-lock.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: fashion-dream-try-on-main/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Repair known TypeScript baseline and persist lockfile
        if: ${{ github.event_name == 'push' && github.ref_name == 'feature/product-admin' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path.cwd()

          site_nav = root / "src/components/site-nav.tsx"
          text = site_nav.read_text()
          text = text.replace('useRef<ReturnType<typeof window.setTimeout> | null>(null)', 'useRef<number | null>(null)')
          site_nav.write_text(text)

          ai_provider = root / "src/lib/ai-provider.server.ts"
          text = ai_provider.read_text()
          old = '''        const prompt = input.images?.length
          ? [
              { type: "text" as const, text: input.prompt },
              ...input.images.map((image) => ({ type: "image" as const, image })),
            ]
          : input.prompt;'''
          new = '''        const prompt = input.images?.length
          ? { text: input.prompt, images: input.images }
          : input.prompt;'''
          if old in text:
              text = text.replace(old, new)
          ai_provider.write_text(text)

          ai_functions = root / "src/lib/ai.functions.ts"
          text = ai_functions.read_text()
          old = '''    const imagePrompt = images.length
      ? [
          { type: "text" as const, text: prompt },
          ...images.map((image) => ({ type: "image" as const, image })),
        ]
      : prompt;'''
          new = '''    const imagePrompt = images.length
      ? { text: prompt, images }
      : prompt;'''
          if old in text:
              text = text.replace(old, new)
          ai_functions.write_text(text)

          cart = root / "src/lib/cart.tsx"
          text = cart.read_text().replace('name: product.name, slug: product.slug, short_description:', 'name: product.name, short_description:')
          cart.write_text(text)

          appearance = root / "src/routes/admin/appearance/content.tsx"
          text = appearance.read_text().replace('Array<[string, keyof AppearanceContent, "dark-logo" | "monogram" | "social-preview", RefObject<HTMLInputElement | null>]>','Array<[string, "dark_logo_url" | "monogram_url" | "social_image_url", "dark-logo" | "monogram" | "social-preview", RefObject<HTMLInputElement | null>]>')
          appearance.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/components/site-nav.tsx src/lib/ai-provider.server.ts src/lib/ai.functions.ts src/lib/cart.tsx src/routes/admin/appearance/content.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix: repair typecheck baseline and add npm lockfile"
            git push origin HEAD:feature/product-admin
          fi

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: Secret exposure gate
        run: npm run security:secrets

      - name: Build
        run: npm run build

      - name: Typecheck generated route tree
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee /tmp/wearo-typecheck.log
        shell: bash

      - name: Upload typecheck diagnostic
        if: ${{ steps.typecheck.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostic
          path: /tmp/wearo-typecheck.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail if typecheck failed
        if: ${{ steps.typecheck.outcome == 'failure' }}
        run: exit 1

      - name: Start development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/wearo-vite.log 2>&1 &
          echo $! > /tmp/wearo-vite.pid

      - name: Wait for development server
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/wearo-vite.log
          exit 1

      - name: Run customer experience validation
        run: npm run test:customer-experience
        env:
          BASE_URL: http://127.0.0.1:8080

      - name: Run lint
        run: npm run lint

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/wearo-vite.log
