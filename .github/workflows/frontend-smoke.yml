name: Frontend smoke tests

on:
  push:
    branches:
      - main
      - feature/product-admin
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://oazipcrbutizdncctkcg.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-smoke-test-placeholder
    defaults:
      run:
        working-directory: fashion-dream-try-on-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify npm runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies and capture diagnostics
        id: npm_install
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/npm-install.log

      - name: Upload npm install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-diagnostics
          path: |
            /tmp/npm-install.log
            fashion-dream-try-on-main/package-lock.json
          if-no-files-found: warn

      - name: Fail if dependency installation failed
        if: steps.npm_install.outcome == 'failure'
        run: exit 1

      - name: Build
        run: npm run build

      - name: Start development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 > /tmp/wearo-vite.log 2>&1 &
          echo $! > /tmp/wearo-vite.pid

      - name: Wait for development server
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wearo-vite.log
          exit 1

      - name: Run customer experience validation
        run: npm run test:customer-experience
        env:
          BASE_URL: http://127.0.0.1:8080

      - name: Run lint and capture diagnostics
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/eslint.log

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostics
          path: /tmp/eslint.log
          if-no-files-found: warn

      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/wearo-vite.log
