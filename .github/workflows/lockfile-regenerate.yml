name: Regenerate npm lockfile

on:
  push:
    branches:
      - feature/product-admin

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.event.head_commit.message != 'chore(security): regenerate npm lockfile' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fashion-dream-try-on-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fashion-dream-try-on-main/package-lock.json

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- fashion-dream-try-on-main/package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fashion-dream-try-on-main/package-lock.json
          git commit -m "chore(security): regenerate npm lockfile"
          git push
