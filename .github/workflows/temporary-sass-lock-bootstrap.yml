name: Temporary Sass Lock Bootstrap

on:
  push:
    branches:
      - feature/sass-migration

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fashion-dream-try-on-main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fashion-dream-try-on-main/package-lock.json
      - name: Generate lockfile
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize Sass lockfile"
          git push origin HEAD:feature/sass-migration
