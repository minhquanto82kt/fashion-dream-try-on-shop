name: Sync npm lockfile

on:
  push:
    branches:
      - feature/product-admin
    paths:
      - ".github/workflows/sync-lockfile.yml"
      - "fashion-dream-try-on-main/package.json"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fashion-dream-try-on-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fashion-dream-try-on-main/package-lock.json

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- fashion-dream-try-on-main/package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fashion-dream-try-on-main/package-lock.json
          git commit -m "chore(deps): sync npm lockfile"
          git push origin HEAD:feature/product-admin
          echo "Synchronized package-lock.json and pushed the update."
