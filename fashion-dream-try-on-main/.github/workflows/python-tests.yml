name: Python backend tests

on:
  push:
    branches:
      - main
      - feature/product-admin
  pull_request:

jobs:
  test-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fashion-dream-try-on-main/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
